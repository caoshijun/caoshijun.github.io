<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oriel 控制中心</title>
<style>body{font:16px system-ui;background:#101724;color:#eef3ff;max-width:850px;margin:50px auto;padding:20px}section{background:#1c293d;padding:24px;border-radius:18px;margin:20px 0}input,button,a.button{padding:12px;border-radius:8px;border:0;margin:6px;font:inherit}a{color:#7dd3fc}button{cursor:pointer;background:#7dd3fc}input{max-width:90%}#status{white-space:pre-wrap}</style>
<h1>Oriel 控制中心</h1><p>选择设备连接方式，或通过 USB 安装固件。</p>
<section><h2>局域网连接</h2><p>电脑和设备需要在同一网络。浏览器可能要求允许访问本地网络。</p><form id="connect"><input id="host" placeholder="192.168.1.100 或设备.local" required><button>连接并打开后台</button></form><button id="retry">尝试上次连接的设备</button><p id="status" role="status"></p></section>
<section><h2>USB 连接</h2><p>连接 USB 数据线，在设备配网模式下设置 Wi-Fi。支持设备识别、配网、屏幕预览及触摸控制。</p><a href="./usb/index.html">打开 USB 控制</a></section>
<section><h2>安装或升级固件</h2><p>使用桌面 Chrome / Edge，通过 USB 安装。升级前备份重要设置。</p><a href="./install/index.html">打开刷机页面</a></section>
<script>
const host=document.querySelector('#host'),status=document.querySelector('#status');host.value=localStorage.getItem('oriel-last-device')||'';
document.querySelector('#retry').onclick=()=>document.querySelector('#connect').requestSubmit();
document.querySelector('#connect').onsubmit=async e=>{e.preventDefault();try{
const u=new URL(host.value.includes('://')?host.value:'http://'+host.value);
if(!['http:','https:'].includes(u.protocol)||u.username||u.password||u.pathname!=='/'||u.search||u.hash)throw Error('请输入设备 IP 或主机名');
status.textContent='正在连接…';
const r=await fetch(u.origin+'/api/settings',{signal:AbortSignal.timeout(8000),cache:'no-store',targetAddressSpace:'local',credentials:'omit'});if(!r.ok)throw Error('HTTP '+r.status);
const s=await r.json();if(!s.version)throw Error('该地址没有返回 Oriel 设备信息');
sessionStorage.setItem('oriel-device',u.origin);localStorage.setItem('oriel-last-device',u.origin);location.href='./control/index.html';
}catch(error){status.textContent='连接失败：'+error.message+'。请检查设备地址、本地网络权限；旧固件可能需要先通过 USB 升级。';}};
</script></html>
